<!doctype html>
<html>
  <head>
    <title>{{ .title }}</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="./css/terminal.css" />
    <link rel="stylesheet" href="./css/xterm.css" />
    <link rel="stylesheet" href="./css/xterm_customize.css" />
  </head>
  <body>
    <div id="terminal"></div>
    <div id="file-manager-btn" class="file-manager-button" onclick="openFileManager()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h2.764c.958 0 1.76.56 2.311 1.184C7.985 3.648 8.48 4 9 4h4.5A1.5 1.5 0 0 1 15 5.5v7a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 12.5v-9zM2.5 3a.5.5 0 0 0-.5.5V6h12v-.5a.5.5 0 0 0-.5-.5H9c-.964 0-1.71-.629-2.174-1.154C6.374 3.334 5.82 3 5.264 3H2.5zM14 7H2v5.5a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5V7z"/>
      </svg>
      <span>Files</span>
    </div>
    <script src="./auth_token.js"></script>
    <script src="./config.js"></script>
    <script src="./js/gotty-bundle.js"></script>
    <script>
      function openFileManager() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (token) {
          // 通过API获取会话token
          fetch('/api/session/info?token=' + encodeURIComponent(token))
            .then(response => response.json())
            .then(data => {
              if (data.success && data.sessionToken) {
                // 打开文件管理器页面，使用会话token
                const fileManagerUrl = '/filebrowser?sessionToken=' + encodeURIComponent(data.sessionToken);
                window.open(fileManagerUrl, '_blank', 'width=1200,height=800,scrollbars=yes,resizable=yes');
              } else {
                alert('Failed to create session for file manager.');
              }
            })
            .catch(error => {
              console.error('Error:', error);
              alert('Failed to connect to file manager.');
            });
        } else {
          alert('No session token found. Please start a new session.');
        }
      }
    </script>
  </body>
</html>
